[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Explicit optimizer settings (match the defaults the gas figures in the
# README were measured with, so a rebuild reproduces them).
optimizer = true
optimizer_runs = 200

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
